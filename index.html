<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>limah28.github.io</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      color: #e6edf3;
      padding: 24px;
    }
    main {
      max-width: 640px;
      text-align: center;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 48px 32px;
      background: #161b22;
    }
    h1 { font-size: 2rem; margin-bottom: 12px; }
    p { color: #8b949e; line-height: 1.6; margin-bottom: 16px; }
    code {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.9em;
    }
    a { color: #58a6ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Halo, ini limah28.github.io 👋</h1>
    <p>Website statis ini di-host dengan <a href="https://pages.github.com/">GitHub Pages</a>.</p>
    <p>Edit file <code>index.html</code> di repo ini untuk mengganti isi halaman.</p>
  </main>
</body>
</html>
